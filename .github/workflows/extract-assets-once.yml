name: Extract AVGL asset package once

on:
  push:
    branches:
      - feat/web-asset-polish-20260918

permissions:
  contents: write

jobs:
  extract-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-asset-polish-20260918
          fetch-depth: 0

      - name: Extract package safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("AVGL_FULL_ASSET_PACKAGE_LAYERED_PROJECTION.zip")
          target = Path("web/assets/package")
          if not archive.exists():
              raise SystemExit(f"missing archive: {archive}")

          if target.exists():
              import shutil
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  raw = member.filename.replace("\\", "/")
                  rel = PurePosixPath(raw)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"unsafe zip path: {raw}")
                  if "__MACOSX" in rel.parts or rel.name == ".DS_Store":
                      continue
                  out = target.joinpath(*rel.parts)
                  if member.is_dir():
                      out.mkdir(parents=True, exist_ok=True)
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(member) as src, out.open("wb") as dst:
                      dst.write(src.read())

          print("Extracted files:")
          for path in sorted(p for p in target.rglob("*") if p.is_file()):
              print(f"{path}\t{path.stat().st_size}")
          PY

      - name: Commit extracted assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/package
          git rm .github/workflows/extract-assets-once.yml
          git commit -m "chore(web): extract AVGL asset package"
          git push origin HEAD:feat/web-asset-polish-20260918
