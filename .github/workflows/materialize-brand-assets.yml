name: Materialize AVGL brand assets

on:
  push:
    branches:
      - feat/brand-assets-responsive-polish-20260918
    paths:
      - ".github/workflows/materialize-brand-assets.yml"
      - "AVGL_FULL_ASSET_PACKAGE_LAYERED_PROJECTION.zip"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brand-assets-responsive-polish-20260918
          fetch-depth: 0
      - name: Extract asset package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web/assets/brand
          mkdir -p web/assets/brand
          tmp_dir="$(mktemp -d)"
          unzip -q AVGL_FULL_ASSET_PACKAGE_LAYERED_PROJECTION.zip -d "$tmp_dir"
          cp -R "$tmp_dir/AVGL_FULL_ASSET_PACKAGE/." web/assets/brand/
          test "$(find web/assets/brand -type f | wc -l)" -eq 115
      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/brand
          if git diff --cached --quiet; then
            echo "Assets already materialized."
            exit 0
          fi
          git commit -m "feat(web): materialize AVGL brand asset package"
          git push origin HEAD:feat/brand-assets-responsive-polish-20260918
